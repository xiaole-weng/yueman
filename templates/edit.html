<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>编辑记录</title>
<style>body{font-family:sans-serif;max-width:500px;margin:40px auto;}
input,select{width:100%;padding:6px;margin:4px 0;box-sizing:border-box;}</style>
</head><body>
<h2>编辑记录 #{{ record.id }}</h2>
<form method="post">
  {% if is_admin %}
  所属账号：<select name="owner">
    {% for u in users %}
      <option value="{{ u.username }}" {% if u.username==record.owner %}selected{% endif %}>{{ u.username }}</option>
    {% endfor %}
  </select><br>
  中介：<select name="agent">
    {% for a in all_agents %}<option value="{{ a.name }}" {% if a.name==record.agent %}selected{% endif %}>{{ a.name }}</option>{% endfor %}
  </select><br>
  价格：<input name="price" type="number" step="0.01" value="{{ record.price }}"><br>
  {% else %}
  中介：{{ record.agent }}（不可修改）<br>
  价格：{{ record.price }}（由管理员设定）<br>
  {% endif %}
  类别：<input name="category" value="{{ record.category }}" required><br>
  数量：<input name="quantity" type="number" value="{{ record.quantity }}"><br>
  备注名称：<input name="note" value="{{ record.note }}" placeholder="如 客户张三"><br>
  <button type="submit">保存</button>
  <a href="{{ url_for('dashboard') }}">取消</a>
</form>
</body></html>
