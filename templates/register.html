<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>注册 - 月满表</title>
<style>body{font-family:sans-serif;max-width:400px;margin:80px auto;padding:20px;}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;}
button{width:100%;padding:10px;background:#1F4E78;color:#fff;border:none;cursor:pointer;}
.flash-error{color:red;} .flash-success{color:green;}</style></head>
<body>
<h2>月满表 · 注册</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<p class="flash-{{ cat }}">{{ msg }}</p>{% endfor %}
{% endwith %}
<form method="post">
  <input name="username" placeholder="用户名（中文/字母/数字，2–32位）" required>
  <input name="password" type="password" placeholder="密码（不限长度）" required>
  <input name="confirm" type="password" placeholder="确认密码" required>
  <button type="submit">注册</button>
</form>
<p><a href="{{ url_for('login') }}">已有账号？去登录</a></p>
</body></html>
