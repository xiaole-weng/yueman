<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>中介管理</title>
<style>
body{font-family:sans-serif;margin:20px;}
table{border-collapse:collapse;width:60%;margin-top:16px;}
th,td{border:1px solid #ccc;padding:8px;text-align:center;}
th{background:#1F4E78;color:#fff;}
.btn-del{background:#d9534f;color:#fff;border:none;padding:6px 12px;cursor:pointer;border-radius:3px;text-decoration:none;display:inline-block;}
.btn-del:hover{background:#c9302c;}
.btn-add{background:#1F4E78;color:#fff;border:none;padding:6px 12px;cursor:pointer;border-radius:3px;}
.flash-success{color:green;background:#e8f5e9;padding:10px;margin-bottom:10px;border-radius:4px;} 
.flash-error{color:red;background:#ffebee;padding:10px;margin-bottom:10px;border-radius:4px;}
</style></head>
<body>
<p><a href="{{ url_for('dashboard') }}">← 返回数据面板</a></p>
<h2>中介管理</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}
    <div class="flash-{{ cat }}">{{ msg }}</div>
  {% endfor %}
{% endwith %}

<form method="post" style="margin-bottom:20px;">
  <input name="name" placeholder="输入新中介名称" required style="padding:6px;width:200px;">
  <button type="submit" class="btn-add">添加中介</button>
</form>

<table>
<tr><th>ID</th><th>中介名称</th><th>操作</th></tr>
{% for a in agents %}
<tr>
  <td>{{ a.id }}</td>
  <td>{{ a.name }}</td>
  <td>
    <!-- 使用普通的 a 标签跳转，避免任何 JS 和 Form 拦截 -->
    <a href="{{ url_for('force_delete_agent', aid=a.id) }}" class="btn-del" onclick="return confirm('确定要彻底删除中介【{{ a.name }}】吗？');">删除</a>
  </td>
</tr>
{% endfor %}
</table>
</body></html>
