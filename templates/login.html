<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>系统登录</title>
<style>
body{font-family:sans-serif;max-width:400px;margin:80px auto;padding:20px;}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;}
button{width:100%;padding:10px;background:#1F4E78;color:#fff;border:none;cursor:pointer;border-radius:3px;}
.flash-error{color:red;} .flash-success{color:green;}
</style></head>
<body>
<h2>记录登录</h2>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<p class="flash-{{ cat }}">{{ msg }}</p>{% endfor %}
{% endwith %}
<form method="post">
  <input name="username" placeholder="账号" required>
  <input name="password" type="password" placeholder="密码" required>
  <button type="submit">登录</button>
</form>
{% if registration_open %}
<p><a href="{{ url_for('register.html') }}">注册新账号</a></p>
{% endif %}
</body></html>
