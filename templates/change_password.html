<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>修改密码</title>
<style>body{font-family:sans-serif;max-width:420px;margin:60px auto;}
input{width:100%;padding:8px;margin:6px 0;box-sizing:border-box;}
button{width:100%;padding:10px;background:#1F4E78;color:#fff;border:none;cursor:pointer;}
.flash-error{color:red;} .flash-success{color:green;}</style></head>
<body>
<h2>修改用户密码</h2>
<p>用户：<b>{{ user.username }}</b>（{{ "管理员" if user.role == "admin" else "普通用户" }}）</p>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<p class="flash-{{ cat }}">{{ msg }}</p>{% endfor %}
{% endwith %}
<form method="post">
  <input name="new_password" type="password" placeholder="新密码（不限长度）" required>
  <input name="confirm" type="password" placeholder="确认新密码" required>
  <button type="submit">保存新密码</button>
</form>
<p><a href="{{ url_for('manage_users') }}">← 返回用户管理</a></p>
</body></html>
