app = "yueman2026"
primary_region = "sin"

[build]

[env]
  DATABASE_PATH = "/data/app.db"

[[mounts]]
  source = "data_volume_v2"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
