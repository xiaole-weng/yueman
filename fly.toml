# fly.toml app configuration file generated for yueman on 2026-11-28T07:44:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'yueman'
primary_region = 'sin'

[build]
[env]
  DATABASE_PATH = '/data/app.db'

[[mounts]]
  source = 'data_volume'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
